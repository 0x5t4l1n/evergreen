name: Ecosystem update
# Fetches public GitHub activity for the accounts listed in the repository
# variable EVERGREEN_GITHUB_USERS (comma separated) and commits it as
# web/data/activity.json. The token never leaves this job.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVERGREEN_GITHUB_USERS: ${{ vars.EVERGREEN_GITHUB_USERS || github.repository_owner }}
        run: go run ./cmd/evergreen-activity --output web/data/activity.json
      - name: Commit and redeploy when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # generatedAt changes every run; compare the content without it
          if git diff --quiet -I'"generatedAt"' -- web/data/activity.json && [ -n "$(git ls-files web/data/activity.json)" ]; then
            echo "No activity changes."; exit 0
          fi
          git config user.name "evergreen-bot"
          git config user.email "evergreen-bot@users.noreply.github.com"
          git add web/data/activity.json
          git commit -m "chore: refresh GitHub activity data"
          git push
          # pushes made with GITHUB_TOKEN do not trigger workflows, so ask for a deploy explicitly
          gh workflow run deploy.yml
